[package]
name = "pdfcraft-android"
description = "PdfCraft on Android tablets (NativeActivity; build with packaging/android/build-apk.sh)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# Loaded by Android's NativeActivity as libpdfcraft_android.so.
crate-type = ["cdylib"]

# Not the workspace lints: `unsafe_code = "forbid"` can't be relaxed per item, and Android needs
# two unsafe-attributed items here (the exported `android_main`, and `set_var` before any thread
# starts). Everything else in the crate stays safe.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[target.'cfg(target_os = "android")'.dependencies]
pdfcraft-ui-egui = { workspace = true }
# Where Scan & OCR finds its models (ocr_models.rs).
pdfcraft-ocr = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "persistence", "android-native-activity"] }
egui = { workspace = true }
# The AndroidApp handle (resolves to vendor/winit, like eframe's own).
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
log = { workspace = true }
android_logger = "0.15"
# All files access: check it and open its Settings screen (file_access.rs).
jni = "0.21"
ndk-context = "0.1"
# Whether a hardware keyboard is attached (tablet.rs; already in the build through android-activity).
ndk = { version = "0.9", default-features = false }
