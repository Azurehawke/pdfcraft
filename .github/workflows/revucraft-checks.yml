name: RevuCraft checks

# The repository's gates for the revucraft branch (format, clippy, tests), plus headless
# screenshots of the app, so UI changes can be looked at without a desktop. Logs and screenshots
# are pushed to the ci-logs-revucraft-ui branch.
on:
  push:
    branches: [revucraft, merge-upstream]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: revucraft-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies (egui, winit, rfd) and a software Vulkan driver for screenshots
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: revucraft-checks

      - name: Format
        run: cargo fmt --all -- --check 2>&1 | tee "$RUNNER_TEMP/fmt.log"

      - name: Clippy
        if: always()
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --keep-going -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log"

      - name: Tests (annotations, render, measure, automation, engine, UI)
        if: always()
        run: |
          set -o pipefail
          cargo test --no-fail-fast -p pdfcraft-create -p pdfcraft-annot -p pdfcraft-render -p pdfcraft-measure -p pdfcraft-automation -p pdfcraft-engine -p pdfcraft-ui-egui 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Screenshots
        if: always()
        env:
          WGPU_BACKEND: vulkan
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          plan="$RUNNER_TEMP/plan.pdf"
          # A small synthetic floor plan (walls, a door swing, dimension text); PdfCraft repairs
          # the missing cross-reference table on open.
          cat > "$plan" <<'PDF'
          %PDF-1.7
          1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj
          2 0 obj << /Type /Pages /Kids [3 0 R] /Count 1 >> endobj
          3 0 obj << /Type /Page /Parent 2 0 R /MediaBox [0 0 1224 792] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >> endobj
          4 0 obj << >> stream
          3 w 120 120 m 900 120 l 900 640 l 120 640 l h S
          2 w 480 120 m 480 400 l 480 460 m 480 640 l 120 400 m 300 400 l 360 400 m 480 400 l S
          1 w 300 400 m 300 460 l S 300 400 m 300 433 327 460 360 460 c S
          0.5 w 120 90 m 900 90 l S 120 84 m 120 96 l 900 84 m 900 96 l S
          BT /F1 14 Tf 470 70 Td (65'-0") Tj ET
          BT /F1 18 Tf 940 600 Td (A-201) Tj 0 -24 Td (FLOOR PLAN) Tj 0 -24 Td (SCALE 1/8" = 1'-0") Tj ET
          endstream endobj
          5 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica >> endobj
          trailer << /Root 1 0 R >>
          %%EOF
          PDF
          sed -i 's/^          //' "$plan"
          shot() { name=$1; shift; cargo run -q --release -p pdfcraft-ui-egui --example shot -- "$RUNNER_TEMP/shots/$name.png" --scale 1 --shell revucraft "$@" 2>&1 | tee -a "$RUNNER_TEMP/shots.log" || echo "shot $name failed" >> "$RUNNER_TEMP/shots.log"; }
          shot home
          shot new-dialog --new-dialog open
          shot new-dialog-add "$plan" --new-dialog add --accent teal
          shot plan "$plan"
          shot plan-light "$plan" --theme light
          shot plan-comments "$plan" --panel comments
          shot plan-measure "$plan" --workflow measure
          shot plan-scale "$plan" --workflow measure --tool measure
          # A synthetic DXF (model space, inches): walls on a WALLS layer.
          dxf="$RUNNER_TEMP/plan.dxf"
          { printf '0\nSECTION\n2\nHEADER\n9\n$INSUNITS\n70\n1\n0\nENDSEC\n0\nSECTION\n2\nENTITIES\n'
            for l in "0 0 780 0" "780 0 780 520" "780 520 0 520" "0 520 0 0" "360 0 360 520" "0 240 360 240"; do
              set -- $l; printf '0\nLINE\n8\nWALLS\n10\n%s\n20\n%s\n11\n%s\n21\n%s\n' "$1" "$2" "$3" "$4"
            done
            printf '0\nENDSEC\n0\nEOF\n'; } > "$dxf"
          shot dxf-open "$dxf" --workflow measure --tool measure
          shot dxf-links "$dxf" --dock links,layers
          shot plan-symbols "$plan" --workflow symbols
          shot plan-layers "$plan" --workflow symbols --panel layers
          shot plan-dock "$plan" --workflow measure --tool measure --dock layers,comments
          shot plan-draft "$plan" --workflow draft --quick draft-wall --dock layers
          shot plan-draft-modify "$plan" --workflow draft --quick draft-fillet --dock markups
          shot plan-draft-collapsed "$plan" --workflow draft --quick draft-polygon --draft-panel collapsed
          shot plan-draft-door "$plan" --workflow draft --quick draft-door --dock tool-chest
          shot plan-draft-wall-side "$plan" --workflow draft --quick draft-wall --wall-side inside --dock layers
          shot plan-draft-rect "$plan" --workflow draft --quick draft-rectangle --dock layers
          # The pasteboard: a wall line and a box running off the sheet's right edge.
          pboard="$RUNNER_TEMP/pasteboard.pdf"
          cat > "$pboard" <<'PDF'
          %PDF-1.7
          1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj
          2 0 obj << /Type /Pages /Kids [3 0 R] /Count 1 >> endobj
          3 0 obj << /Type /Page /Parent 2 0 R /MediaBox [0 0 1224 792] /Contents 4 0 R /Annots [6 0 R 8 0 R] >> endobj
          4 0 obj << >> stream
          3 w 120 120 m 900 120 l 900 640 l 120 640 l h S
          endstream endobj
          6 0 obj << /Type /Annot /Subtype /Line /Rect [890 290 1430 310] /L [900 300 1420 300] /BS << /W 6 >> /C [0 0 0] /AP << /N 7 0 R >> >> endobj
          7 0 obj << /Type /XObject /Subtype /Form /BBox [890 290 1430 310] >> stream
          0 0 0 RG 6 w 900 300 m 1420 300 l S
          endstream endobj
          8 0 obj << /Type /Annot /Subtype /Square /Rect [1100 560 1340 700] /BS << /W 2 >> /C [0.85 0.1 0.1] /AP << /N 9 0 R >> >> endobj
          9 0 obj << /Type /XObject /Subtype /Form /BBox [1100 560 1340 700] >> stream
          0.85 0.1 0.1 RG 2 w 1101 561 238 138 re S
          endstream endobj
          trailer << /Root 1 0 R >>
          %%EOF
          PDF
          sed -i 's/^          //' "$pboard"
          shot plan-pasteboard "$pboard" --workflow draft --zoom 50
          shot plan-markup "$plan" --workflow markup
          shot plan-photo-callout "$plan" --workflow symbols --quick photo-callout
          shot plan-cable "$plan" --workflow measure --quick measure-cable
          shot plan-markups-list "$plan" --workflow markup --dock markups
          shot plan-forms "$plan" --workflow forms
          shot plan-review "$plan" --workflow review
          shot plan-document "$plan" --workflow document
          shot plan-teal "$plan" --accent teal
          shot phone "$plan" --size 430x900 --scale 2
          shot phone-home --size 430x900 --scale 2
          shot plan-icons-neutral "$plan" --workflow markup --icon-color neutral
          shot all-tools "$plan" --mode all
          shot plan-links "$plan" --workflow draft --dock links
          # A synthetic budget workbook (CSV) placed as a linked table, and the Place table dialog.
          csv="$RUNNER_TEMP/budget.csv"
          printf 'Item,Qty,Unit cost,Total\nDoors,12,450,5400\nWindows,18,620,11160\nFlooring (sq ft),2400,6.5,15600\nPaint (gal),40,38,1520\nTotal,,,33680\n' > "$csv"
          shot plan-table "$plan" --workflow draft --place-table "$csv"
          shot plan-table-dialog "$plan" --table-dialog "$csv"
          shot plan-send-dialog "$plan" --place-table "$csv" --quantities-dialog open
          shot plan-table-resize "$plan" --workflow draft --place-table "$csv" --table-size 160 --move-link 0 --dock links
          shot update-available "$plan" --update available
          shot update-prompt "$plan" --update prompt

      - name: Publish logs and screenshots
        if: always()
        run: |
          dir=$(mktemp -d)
          cp "$RUNNER_TEMP"/*.log "$dir/" 2>/dev/null || true
          cp -r "$RUNNER_TEMP/shots" "$dir/" 2>/dev/null || true
          grep -E "^(error|warning)(\[[A-Z0-9]+\])?:" -A14 "$RUNNER_TEMP"/clippy.log "$RUNNER_TEMP"/test.log 2>/dev/null | head -c 80000 > "$dir/errors.txt" || true
          grep -E "^test .* FAILED|panicked at|^failures:" -A6 "$RUNNER_TEMP"/test.log 2>/dev/null | head -c 40000 >> "$dir/errors.txt" || true
          cd "$dir" && git init -q -b ci-logs-revucraft-ui && git add -A \
            && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "RevuCraft checks ${{ github.run_number }} (${GITHUB_SHA::7}): ${{ job.status }}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-revucraft-ui
