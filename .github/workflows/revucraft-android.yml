name: RevuCraft Android APK

# Builds RevuCraft (the revucraft branch) for Android tablets (arm64) as its own app,
# io.github.azurehawke.revucraft, so it installs beside PdfCraft, and publishes the APK as the
# `revucraft-latest` prerelease, which a tablet's browser can download directly.
on:
  push:
    branches: [revucraft]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Faster CI builds than the desktop release profile (thin LTO, one codegen unit).
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_STRIP: debuginfo
  APP_ID: io.github.azurehawke.revucraft
  APP_LABEL: RevuCraft
  APK_NAME: revucraft
  ANDROID_RES: packaging/android/revucraft/res

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, for the build number below.
          fetch-depth: 0

      # One build number for Android, Windows and Linux: commits on the branch since the
      # numbering began (after Android build 28), so the same commit gets the same number.
      - name: Build number
        shell: bash
        run: echo "REVUCRAFT_BUILD=$((29 + $(git rev-list --count 30c135dbb2eda2b9abd9509c34b0f3846c127839..HEAD)))" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: revucraft-android-arm64

      # javac for the activity class (packaging/android/java).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Use the runner's NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Signing key from secrets (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            } >> "$GITHUB_ENV"
            echo "Signing with the key from secrets"
          else
            echo "Signing with packaging/android/debug.keystore"
          fi

      # The pens' look, from the real code: a sample page (on the ci-logs branch) and the tests.
      - name: Pen and unpack checks
        continue-on-error: true
        run: |
          set -o pipefail
          PEN_SAMPLE_OUT="$RUNNER_TEMP/pen-sample.pdf" cargo test -p pdfcraft-annot --lib pen 2>&1 | tail -60 | tee "$RUNNER_TEMP/pen-test.log"
          UNPACK_SAMPLE_DIR="$RUNNER_TEMP" cargo test -p pdfcraft-edit --lib text_in_forms 2>&1 | tail -80 | tee -a "$RUNNER_TEMP/pen-test.log"

      - name: Build the APK
        env:
          VERSION_CODE: ${{ env.REVUCRAFT_BUILD }}
        run: |
          set -o pipefail
          bash packaging/android/build-apk.sh 2>&1 | tee "$RUNNER_TEMP/build.log"

      # The log, readable without the Actions log viewer: compiler errors as annotations, and the
      # whole log on the ci-logs branch.
      - name: Report the build log
        if: always()
        run: |
          log="$RUNNER_TEMP/build.log"
          [ -f "$log" ] || exit 0
          grep -E "^error(\[E[0-9]+\])?:" -A12 "$log" | head -c 60000 > "$RUNNER_TEMP/errors.txt" || true
          grep -E "^error(\[E[0-9]+\])?:" "$log" | head -40 | while IFS= read -r line; do echo "::error::${line}"; done || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          dir=$(mktemp -d)
          cp "$log" "$RUNNER_TEMP/errors.txt" "$dir/"
          cp "$RUNNER_TEMP/pen-sample.pdf" "$RUNNER_TEMP/pen-test.log" "$RUNNER_TEMP"/unpack-*.pdf "$dir/" 2>/dev/null || true
          cd "$dir" && git init -q -b ci-logs-revucraft && git add -A \
            && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "RevuCraft Android build ${{ env.REVUCRAFT_BUILD }} (${GITHUB_SHA::7}): ${{ job.status }}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-revucraft

      - uses: actions/upload-artifact@v4
        with:
          name: revucraft-android
          path: target/android-apk/revucraft.apk

      - name: Publish as the revucraft-latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete revucraft-latest --yes --cleanup-tag || true
          gh release create revucraft-latest target/android-apk/revucraft.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "RevuCraft for Android (build ${{ env.REVUCRAFT_BUILD }})" \
            --notes "Built from ${GITHUB_SHA::7} on the revucraft branch. Install revucraft.apk on the tablet; it installs beside PdfCraft. See docs/android.md and REVUCRAFT.md."
